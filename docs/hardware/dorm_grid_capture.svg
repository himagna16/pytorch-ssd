<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Grid capture: 9 marks + empty room, tile layout</title><rect width="1000" height="640" fill="#fff"/>
<defs>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4a"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
<pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#d8c29c" stroke-width="2"/></pattern>
</defs>
<text x="24" y="32" font-size="20" font-weight="bold" fill="#1d8a4a">GRID CAPTURE: 9 green marks (3 rows x 3), you are the subject</text>
<text x="24" y="54" fill="#555">Seen from BEHIND the drone looking at the door: the drone's left = the page's left.</text>

<rect x="102" y="224" width="84" height="266" fill="url(#h)" stroke="#b8975f" stroke-width="2"/>
<rect x="384" y="224" width="84" height="266" fill="url(#h)" stroke="#b8975f" stroke-width="2"/>
<text x="144" y="353.2" text-anchor="middle" fill="#8a6a35" font-size="11">bed</text>
<text x="144" y="367.2" text-anchor="middle" fill="#8a6a35" font-size="11">~7 ft</text>
<text x="426" y="353.2" text-anchor="middle" fill="#8a6a35" font-size="11">bed</text>
<text x="426" y="367.2" text-anchor="middle" fill="#8a6a35" font-size="11">~7 ft</text>
<rect x="190" y="110" width="190" height="380" fill="#f7f7f4" stroke="#333" stroke-width="3"/>
<line x1="228" y1="110" x2="228" y2="490" stroke="#d6d6cf"/>
