<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Tomorrow: Lighthouse base stations and permanent origin tape</title>
  <rect width="940" height="700" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#d8c29c" stroke-width="2"/></pattern>
  </defs>

  <text x="24" y="32" font-size="20" font-weight="bold" fill="#1f5fbf">TOMORROW: Lighthouse setup (2 pieces of tape, permanent)</text>
  <text x="24" y="54" fill="#555">Same view as tonight's sheet: door at the top, window at the bottom.</text>

  <rect x="60" y="90" width="385" height="506" fill="#fbfbfb" stroke="#333" stroke-width="4"/>
  <line x1="200" y1="90" x2="300" y2="90" stroke="#fbfbfb" stroke-width="6"/>
  <text x="250" y="80" text-anchor="middle" font-weight="bold" fill="#333">DOOR</text>
  <line x1="90" y1="596" x2="420" y2="596" stroke="#6fb3e0" stroke-width="7"/>
  <text x="252" y="620" text-anchor="middle" font-weight="bold" fill="#2a7ab0">WINDOW WALL (curtains closed)</text>
  <rect x="63" y="170" width="104" height="250" fill="url(#h)" stroke="#b8975f" stroke-width="2"/>
  <text x="115" y="300" text-anchor="middle" fill="#8a6a35" font-size="12">loft</text>
  <rect x="338" y="170" width="104" height="250" fill="url(#h)" stroke="#b8975f" stroke-width="2"/>
  <text x="390" y="300" text-anchor="middle" fill="#8a6a35" font-size="12">loft</text>

  <!-- centre-finding dimensions -->
  <line x1="66" y1="470" x2="439" y2="470" stroke="#c0392b" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="84" y="460" width="94" height="18" fill="#fff"/><text x="131" y="473" text-anchor="middle" fill="#c0392b" font-size="11">room width ÷ 2</text>
  <line x1="215" y1="96" x2="215" y2="590" stroke="#c0392b" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)" opacity="0.6"/>
  <rect x="148" y="170" width="62" height="32" fill="#fff"/><text x="178" y="183" text-anchor="middle" fill="#c0392b" font-size="11">room length</text><text x="178" y="197" text-anchor="middle" fill="#c0392b" font-size="11">÷ 2</text>

  <!-- stations -->
  <line x1="410" y1="125" x2="258" y2="336" stroke="#e07b00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="95" y1="560" x2="246" y2="346" stroke="#e07b00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="410" cy="125" r="17" fill="#e07b00" stroke="#8a4a00" stroke-width="2"/><text x="410" y="131" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">1</text>
  <text x="392" y="112" text-anchor="end" fill="#8a4a00" font-weight="bold">Station 1 (door end, by your chair)</text>
  <circle cx="95" cy="560" r="17" fill="#e07b00" stroke="#8a4a00" stroke-width="2"/><text x="95" y="566" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">2</text>
  <text x="118" y="548" fill="#8a4a00" font-weight="bold">Station 2 (window end, opposite side)</text>

  <!-- origin + x -->
  <g stroke="#1f5fbf" stroke-width="4"><line x1="244" y1="332" x2="260" y2="348"/><line x1="260" y1="332" x2="244" y2="348"/></g>
  <text x="268" y="335" fill="#1f5fbf" font-weight="bold">TAPE ① ORIGIN</text>
  <text x="268" y="351" fill="#1f5fbf" font-size="11">middle of the floor</text>
  <line x1="252" y1="350" x2="252" y2="446" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="240" y1="452" x2="264" y2="452" stroke="#1f5fbf" stroke-width="4"/>
  <text x="268" y="404" fill="#1f5fbf" font-weight="bold">3 ft 3⅜ in (1.00 m)</text>
  <text x="268" y="420" fill="#1f5fbf" font-size="11">straight toward the window</text>
  <text x="272" y="457" fill="#1f5fbf" font-weight="bold">TAPE ② +x mark</text>

  <g transform="translate(480,100)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#222">Step by step (after the hub arrives)</text>
    <text x="0" y="28" font-weight="bold" fill="#8a4a00">Stations</text>
    <text x="0" y="46" fill="#333">One at each END of the room, opposite sides</text>
    <text x="0" y="63" fill="#333">(diagonal). Raise above the loft mattresses,</text>
    <text x="0" y="80" fill="#333">tilt 30-45° down, aim at ① ORIGIN, lock tight.</text>
    <text x="0" y="97" fill="#333">Channels in cfclient: station 1 → 1, station 2 → 2.</text>
    <text x="0" y="127" font-weight="bold" fill="#1f5fbf">① ORIGIN</text>
    <text x="0" y="145" fill="#333">Middle of the floor: half the room's width,</text>
    <text x="0" y="162" fill="#333">half its length. Tape an X.</text>
    <text x="0" y="192" font-weight="bold" fill="#1f5fbf">② +x mark</text>
    <text x="0" y="210" fill="#333">From ① measure exactly 3 ft 3⅜ in straight</text>
    <text x="0" y="227" fill="#333">toward the window. Tape a line.</text>
    <text x="0" y="257" font-weight="bold" fill="#1f5fbf">Leave both forever</text>
    <text x="0" y="275" fill="#333">They define the room's coordinates. If they</text>
    <text x="0" y="292" fill="#333">move, every Lighthouse position shifts with them.</text>
    <text x="0" y="322" font-weight="bold" fill="#222">cfclient geometry wizard</text>
    <text x="0" y="340" fill="#333">Drone on ① → drone on ② → a few floor spots →</text>
    <text x="0" y="357" fill="#333">hold it still in the air. Both stations go green.</text>
    <text x="0" y="387" fill="#888" font-size="11">Tonight's green camera-check tape is a DIFFERENT sheet</text>
    <text x="0" y="403" fill="#888" font-size="11">(dorm_camera_check.svg). It can be peeled up afterwards.</text>
  </g>
</svg>
