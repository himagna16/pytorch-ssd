<text x="361.0" y="506" text-anchor="middle" fill="#999" font-size="10">col 5</text>
<line x1="170" y1="494" x2="400" y2="494" stroke="#6fb3e0" stroke-width="7"/>
<text x="285.0" y="526" text-anchor="middle" font-weight="bold" fill="#2a7ab0">WINDOW END (curtains closed)</text>
<text x="285.0" y="100" text-anchor="middle" font-weight="bold" fill="#333">DOOR END</text>
<text x="180" y="572" fill="#888" font-size="11">Each square = one 1 ft floor tile. 5 wide x 10 long, to scale. Beds approximate.</text>
<line x1="440" y1="80" x2="291.0" y2="294.0" stroke="#e07b00" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="130" y1="512" x2="279.0" y2="306.0" stroke="#e07b00" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="440" cy="80" r="16" fill="#e07b00" stroke="#8a4a00" stroke-width="2"/><text x="440" y="86" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">2</text>
<circle cx="130" cy="512" r="16" fill="#e07b00" stroke="#8a4a00" stroke-width="2"/><text x="130" y="518" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">1</text>
<text x="418" y="85" text-anchor="end" fill="#8a4a00" font-weight="bold" font-size="12">Channel 2: door end, your side ✓</text>
<text x="40" y="554" fill="#8a4a00" font-weight="bold" font-size="12">Channel 1: window end, Oaj's corner ✓</text>
<rect x="186" y="280.0" width="198" height="40" fill="#e8f0ff" stroke="#1f5fbf" stroke-width="1.5" rx="6" opacity="0.9"/>
<g stroke="#1f5fbf" stroke-width="5"><line x1="275.0" y1="290.0" x2="295.0" y2="310.0"/><line x1="295.0" y1="290.0" x2="275.0" y2="310.0"/></g>
<text x="285.0" y="336.0" text-anchor="middle" fill="#1f5fbf" font-weight="bold">① ORIGIN</text>
<g stroke="#1f5fbf" stroke-width="5"><line x1="199.0" y1="290.0" x2="219.0" y2="310.0"/><line x1="219.0" y1="290.0" x2="199.0" y2="310.0"/></g>
<text x="209.0" y="336.0" text-anchor="middle" fill="#1f5fbf" font-weight="bold">③ SIDE</text>
<line x1="221.0" y1="288.0" x2="273.0" y2="288.0" stroke="#c0392b" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"/>
<text x="247.0" y="282.0" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">2 tiles</text>
<line x1="285.0" y1="278.0" x2="285.0" y2="181.3125" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#b)"/>
<line x1="271.0" y1="175.3125" x2="299.0" y2="175.3125" stroke="#1f5fbf" stroke-width="5"/>
<text x="303.0" y="180.3125" fill="#1f5fbf" font-weight="bold">② +x</text>
<text x="303.0" y="227.8" fill="#1f5fbf" font-weight="bold" font-size="12">1.00 m</text>
<text x="303.0" y="241.8" fill="#1f5fbf" font-size="11">(3 tiles + 3⅜ in)</text>
<text x="209.0" y="352.0" text-anchor="middle" fill="#555" font-size="10">left of +x</text>
<g transform="translate(580,96)">
<text x="0" y="0" font-size="15" font-weight="bold" fill="#222">Done so far ✓</text>
<text x="0" y="18" fill="#333">✓ tape  ✓ channels (1 window end, 2 door end)  ✓ stands</text>
<text x="0" y="50" font-weight="bold" fill="#1f5fbf">NEXT: room setup wizard (cfclient)</text>
<text x="0" y="68" fill="#333">Drone on the cable, battery in. cfclient: pick usb://0 → Connect.</text>
<text x="0" y="86" fill="#333">Lighthouse Positioning tab → "Start Set Up". For each step</text>
<text x="0" y="104" fill="#333">put the drone down, hands off, click "Start measurement":</text>
<text x="0" y="122" fill="#333">  Origin sample   → drone on ① ORIGIN</text>
<text x="0" y="140" fill="#333">  X-axis sample   → drone on ② +x</text>
<text x="0" y="158" fill="#333">  XY-plane sample → drone on ③ SIDE</text>
<text x="0" y="176" fill="#333">  XYZ-space (3-5) → hold it ~waist high over the floor,</text>
<text x="0" y="194" fill="#333">     twist left-right quickly, hold still, "Sample position".</text>
<text x="0" y="212" fill="#333">     Spread them out: near ①, near each end, near ③.</text>
<text x="0" y="230" fill="#333">Wait for "Uploaded". Then Disconnect in cfclient.</text>
<text x="0" y="262" font-weight="bold" fill="#1f5fbf">THEN: tape check (Terminal)</text>
<rect x="0" y="265" width="405" height="23" rx="4" fill="#f2f2f2" stroke="#ccc"/>
<text x="7" y="281" font-family="Menlo, monospace" font-size="11" fill="#222">../cfloaderenv/bin/python tools/lighthouse/tape_check.py</text>
<text x="0" y="298" fill="#333">A on ①, B on ②, C on ③, D on ① turned 90° LEFT</text>
<text x="0" y="316" fill="#333">(camera then faces ③). Camera faces +x for A, B, C.</text>
<text x="0" y="334" font-weight="bold" fill="#c0392b">All 4 PASS = room frame right + yaw sign confirmed.</text>
<text x="0" y="366" fill="#888" font-size="11">Run from ~/Downloads/drone/pytorch_ssd. cfclient must be disconnected first.</text>
</g>
</svg>