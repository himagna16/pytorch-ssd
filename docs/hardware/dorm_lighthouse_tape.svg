<text x="247.0" y="544" text-anchor="middle" fill="#999" font-size="10">col 2</text>
<text x="285.0" y="544" text-anchor="middle" fill="#999" font-size="10">col 3</text>
<text x="323.0" y="544" text-anchor="middle" fill="#999" font-size="10">col 4</text>
<text x="361.0" y="544" text-anchor="middle" fill="#999" font-size="10">col 5</text>
<line x1="170" y1="532" x2="400" y2="532" stroke="#6fb3e0" stroke-width="7"/>
<text x="285.0" y="564" text-anchor="middle" font-weight="bold" fill="#2a7ab0">WINDOW END (curtains closed)</text>
<text x="285.0" y="100" text-anchor="middle" font-weight="bold" fill="#333">DOOR END</text>
<text x="180" y="610" fill="#888" font-size="11">Each square = one 1 ft floor tile. 5 wide x 11 long, to scale. Beds approximate.</text>
<line x1="440" y1="80" x2="291.0" y2="313.0" stroke="#e07b00" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="130" y1="550" x2="279.0" y2="325.0" stroke="#e07b00" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="440" cy="80" r="16" fill="#e07b00" stroke="#8a4a00" stroke-width="2"/><text x="440" y="86" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">1</text>
<circle cx="130" cy="550" r="16" fill="#e07b00" stroke="#8a4a00" stroke-width="2"/><text x="130" y="556" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">2</text>
<text x="418" y="85" text-anchor="end" fill="#8a4a00" font-weight="bold" font-size="12">Station 1 = channel 1 (door end)</text>
<text x="40" y="592" fill="#8a4a00" font-weight="bold" font-size="12">Station 2 = channel 2 (window end, other side)</text>
<rect x="186" y="299.0" width="198" height="40" fill="#e8f0ff" stroke="#1f5fbf" stroke-width="1.5" rx="6" opacity="0.9"/>
<g stroke="#1f5fbf" stroke-width="5"><line x1="275.0" y1="309.0" x2="295.0" y2="329.0"/><line x1="295.0" y1="309.0" x2="275.0" y2="329.0"/></g>
<text x="285.0" y="295.0" text-anchor="middle" fill="#1f5fbf" font-weight="bold">① ORIGIN</text>
<g stroke="#1f5fbf" stroke-width="5"><line x1="351.0" y1="309.0" x2="371.0" y2="329.0"/><line x1="371.0" y1="309.0" x2="351.0" y2="329.0"/></g>
<text x="361.0" y="295.0" text-anchor="middle" fill="#1f5fbf" font-weight="bold">③ SIDE</text>
<line x1="297.0" y1="333.0" x2="349.0" y2="333.0" stroke="#c0392b" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"/>
<text x="323.0" y="351.0" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">2 tiles</text>
<line x1="285.0" y1="341.0" x2="285.0" y2="437.6875" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#b)"/>
<line x1="271.0" y1="443.6875" x2="299.0" y2="443.6875" stroke="#1f5fbf" stroke-width="5"/>
<text x="303.0" y="448.6875" fill="#1f5fbf" font-weight="bold">② +x</text>
<text x="267.0" y="391.2" text-anchor="end" fill="#1f5fbf" font-weight="bold" font-size="12">3 tiles</text>
<text x="267.0" y="405.2" text-anchor="end" fill="#1f5fbf" font-size="11">+ 3⅜ in</text>
<g transform="translate(580,96)">
<text x="0" y="0" font-size="15" font-weight="bold" fill="#222">Tonight, in this order</text>
<text x="0" y="18" font-weight="bold" fill="#1f5fbf">1. Tape (blue)</text>
<text x="0" y="36" fill="#333">① ORIGIN: middle of row 6, middle of col 3.</text>
<text x="0" y="54" fill="#333">② +x: from ①, 3 tiles + 3⅜ in toward the window.</text>
<text x="0" y="72" fill="#333">③ SIDE: middle of row 6, middle of col 5 (2 tiles over).</text>
<text x="0" y="104" font-weight="bold" fill="#8a4a00">2. Station channels (one at a time)</text>
<text x="0" y="122" fill="#333">Station powered + its micro-USB into the hub.</text>
<text x="0" y="140" fill="#333">cfclient → Lighthouse tab → "Set BS channel" → Scan.</text>
<text x="0" y="158" fill="#333">Station 1 → 1. Unplug, plug station 2 → 2.</text>
<text x="0" y="190" font-weight="bold" fill="#8a4a00">3. Stands</text>
<text x="0" y="208" fill="#333">Diagonal corners as drawn, above the bed mattresses,</text>
<text x="0" y="226" fill="#333">tilted down at ① ORIGIN, heads locked. Power only.</text>
<text x="0" y="258" font-weight="bold" fill="#1f5fbf">4. Geometry wizard (cfclient, drone on the cable)</text>
<text x="0" y="276" fill="#333">Drone on ① → on ② → a few floor spots → held still</text>
<text x="0" y="294" fill="#333">in the air. Camera facing the window each time.</text>
<text x="0" y="326" font-weight="bold" fill="#1f5fbf">5. Tape check (Terminal, cfclient disconnected)</text>
<rect x="0" y="329" width="405" height="23" rx="4" fill="#f2f2f2" stroke="#ccc"/>
<text x="7" y="345" font-family="Menlo, monospace" font-size="11" fill="#222">../cfloaderenv/bin/python tools/lighthouse/tape_check.py</text>
<text x="0" y="362" fill="#333">A on ①, B on ②, C on ③, D on ① turned 90° LEFT.</text>
<text x="0" y="380" font-weight="bold" fill="#c0392b">All 4 PASS = room frame right + yaw sign confirmed.</text>
<text x="0" y="412" fill="#888" font-size="11">Run commands from ~/Downloads/drone/pytorch_ssd. Green camera tape can stay.</text>
</g>
</svg>