<text x="180" y="169" text-anchor="end" fill="#b08600" font-size="11">9 tiles from window</text>
<g stroke="#1d8a4a" stroke-width="5"><line x1="274.0" y1="137" x2="296.0" y2="159"/><line x1="296.0" y1="137" x2="274.0" y2="159"/></g>
