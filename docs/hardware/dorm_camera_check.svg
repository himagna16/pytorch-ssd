<text x="209.0" y="121" text-anchor="middle" fill="#1d8a4a" font-weight="bold" font-size="12">③ LEFT</text>
<g stroke="#1d8a4a" stroke-width="5"><line x1="350.0" y1="137" x2="372.0" y2="159"/><line x1="372.0" y1="137" x2="350.0" y2="159"/></g>
<text x="361.0" y="121" text-anchor="middle" fill="#1d8a4a" font-weight="bold" font-size="12">④ RIGHT</text>
<text x="209.0" y="105" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">clip 1</text>
<text x="361.0" y="105" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">clip 2</text>
<g transform="translate(580,96)">
<text x="0" y="0" font-size="15" font-weight="bold" fill="#222">Step by step, counting tiles</text>
<text x="0" y="18" font-weight="bold" fill="#1d8a4a">① Drone</text>
<text x="0" y="36" fill="#333">Chair at the window end, in the MIDDLE column (col 3).</text>
<text x="0" y="54" fill="#333">Drone on books on the seat, lens ~2 ft 7½ in off the floor,</text>
<text x="0" y="72" fill="#333">lens right above the joint between row 1 and row 2,</text>
<text x="0" y="90" fill="#333">camera pointing straight at the door. NO tape for the drone.</text>
<text x="0" y="122" font-weight="bold" fill="#1d8a4a">② CENTER (tape #1)</text>
<text x="0" y="140" fill="#333">Count 9 tiles from the window wall toward the door</text>
<text x="0" y="158" fill="#333">(= 8 tiles past the lens). On the line where tile 9 ends,</text>
<text x="0" y="176" fill="#333">middle of col 3. Tape an X.</text>
<text x="0" y="208" font-weight="bold" fill="#1d8a4a">③ LEFT  ④ RIGHT (tapes #2 and #3)</text>
<text x="0" y="226" fill="#333">Same line, 2 tiles sideways: middle of col 1 (LEFT)</text>
<text x="0" y="244" fill="#333">and middle of col 5 (RIGHT). Tape an X on each.</text>
<text x="0" y="262" fill="#333">LEFT = your left when you stand behind the drone.</text>
<text x="0" y="280" fill="#333">Move chairs / the basket if they are in the way.</text>
<text x="0" y="312" font-weight="bold" fill="#1d8a4a">Run it</text>
<text x="0" y="330" fill="#333">Battery in, wait 30 s, join WiFi "WiFi streaming example":</text>
<rect x="0" y="333" width="405" height="23" rx="4" fill="#f2f2f2" stroke="#ccc"/>
<text x="7" y="349" font-family="Menlo, monospace" font-size="11" fill="#222">zsh ~/Downloads/drone/pytorch_ssd/tools/real_frames/camera_check.sh</text>
<text x="0" y="366" fill="#333">Enter → walk to ③ LEFT during the countdown → face the drone,</text>
<text x="0" y="384" fill="#333">stand still 10 s. Then the same on ④ RIGHT.</text>
<text x="0" y="416" font-weight="bold" fill="#c0392b">Done when it prints MIRROR CHECK … PASS.</text>
<text x="0" y="434" fill="#333">Rejoin normal WiFi and send Claude the folder name.</text>
<text x="0" y="466" fill="#888" font-size="11">Lighthouse tape is a different sheet (dorm_lighthouse_tape.svg).</text>
</g>
