<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Tonight: camera + mirror check tape layout</title>
  <rect width="940" height="700" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4a"/></marker>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#d8c29c" stroke-width="2"/></pattern>
  </defs>

  <text x="24" y="32" font-size="20" font-weight="bold" fill="#1d8a4a">TONIGHT: camera check (4 pieces of tape)</text>
  <text x="24" y="54" fill="#555">Drawn as if you stand BEHIND the drone looking at the door, so the drone's left = the left of this page.</text>

  <!-- room: x 60..445 (3.5 m), y 90..596 (4.6 m); 1 m = 110 px -->
  <rect x="60" y="90" width="385" height="506" fill="#fbfbfb" stroke="#333" stroke-width="4"/>
  <!-- door top -->
  <line x1="200" y1="90" x2="300" y2="90" stroke="#fbfbfb" stroke-width="6"/>
  <text x="250" y="80" text-anchor="middle" font-weight="bold" fill="#333">DOOR (closed, mirror covered)</text>
  <!-- window bottom -->
  <line x1="90" y1="596" x2="420" y2="596" stroke="#6fb3e0" stroke-width="7"/>
  <text x="252" y="620" text-anchor="middle" font-weight="bold" fill="#2a7ab0">WINDOW WALL (curtains closed, room lights on)</text>
  <!-- lofts -->
  <rect x="63" y="170" width="104" height="250" fill="url(#h)" stroke="#b8975f" stroke-width="2"/>
  <text x="115" y="300" text-anchor="middle" fill="#8a6a35" font-size="12">loft /</text><text x="115" y="315" text-anchor="middle" fill="#8a6a35" font-size="12">desk</text>
  <rect x="338" y="170" width="104" height="250" fill="url(#h)" stroke="#b8975f" stroke-width="2"/>
  <text x="390" y="300" text-anchor="middle" fill="#8a6a35" font-size="12">loft /</text><text x="390" y="315" text-anchor="middle" fill="#8a6a35" font-size="12">desk</text>

  <!-- step 1: centre of window wall -->
  <line x1="66" y1="582" x2="439" y2="582" stroke="#c0392b" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="120" y="572" width="80" height="18" fill="#fff"/><text x="160" y="585" text-anchor="middle" fill="#c0392b" font-size="11">wall width ÷ 2</text>

  <!-- chair + drone -->
  <rect x="225" y="515" width="54" height="50" rx="6" fill="#e3c79b" stroke="#a07a45" stroke-width="2"/>
  <text x="252" y="560" text-anchor="middle" font-size="10" fill="#6b4a1e">chair</text>
  <rect x="236" y="518" width="32" height="26" rx="4" fill="#1d8a4a"/>
  <text x="252" y="535" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">drone</text>
  <line x1="252" y1="516" x2="252" y2="492" stroke="#1d8a4a" stroke-width="3" marker-end="url(#g)"/>
  <text x="290" y="505" fill="#1d8a4a" font-size="11">camera points</text><text x="290" y="518" fill="#1d8a4a" font-size="11">at the door</text>
  <circle cx="252" cy="572" r="5" fill="#1d8a4a"/>
  <text x="300" y="569" fill="#1d8a4a" font-size="11" font-weight="bold">TAPE ① chair spot</text>

  <!-- step 3: 8 ft 2.5 in -->
  <line x1="252" y1="516" x2="252" y2="283" stroke="#c0392b" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="258" y="386" width="100" height="36" fill="#fff" opacity="0.95"/>
  <text x="264" y="400" fill="#c0392b" font-weight="bold">8 ft 2½ in</text>
  <text x="264" y="416" fill="#c0392b" font-size="11">(2.5 m) from lens</text>

  <!-- step 4: sideways 2 ft 2.5 in -->
  <line x1="245" y1="272" x2="183" y2="272" stroke="#c0392b" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="259" y1="272" x2="321" y2="272" stroke="#c0392b" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="214" y="262" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">2 ft 2½ in</text>
  <text x="290" y="262" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">2 ft 2½ in</text>

  <!-- tape marks -->
  <g stroke="#1d8a4a" stroke-width="4"><line x1="244" y1="264" x2="260" y2="280"/><line x1="260" y1="264" x2="244" y2="280"/></g>
  <g stroke="#1d8a4a" stroke-width="4"><line x1="170" y1="264" x2="186" y2="280"/><line x1="186" y1="264" x2="170" y2="280"/></g>
  <g stroke="#1d8a4a" stroke-width="4"><line x1="318" y1="264" x2="334" y2="280"/><line x1="334" y1="264" x2="318" y2="280"/></g>
  <text x="252" y="300" text-anchor="middle" fill="#1d8a4a" font-weight="bold">② CENTER</text>
  <text x="178" y="300" text-anchor="middle" fill="#1d8a4a" font-weight="bold">③ LEFT</text>
  <text x="326" y="300" text-anchor="middle" fill="#1d8a4a" font-weight="bold">④ RIGHT</text>

  <!-- stick figures -->
  <g stroke="#555" stroke-width="2" fill="none"><circle cx="178" cy="215" r="8"/><line x1="178" y1="223" x2="178" y2="245"/><line x1="166" y1="232" x2="190" y2="232"/><line x1="178" y1="245" x2="170" y2="258"/><line x1="178" y1="245" x2="186" y2="258"/></g>
  <text x="178" y="200" text-anchor="middle" fill="#555" font-size="12" font-weight="bold">clip 1</text>
  <g stroke="#999" stroke-width="2" fill="none" stroke-dasharray="3 2"><circle cx="326" cy="215" r="8"/><line x1="326" y1="223" x2="326" y2="245"/><line x1="314" y1="232" x2="338" y2="232"/><line x1="326" y1="245" x2="318" y2="258"/><line x1="326" y1="245" x2="334" y2="258"/></g>
  <text x="326" y="200" text-anchor="middle" fill="#888" font-size="12" font-weight="bold">clip 2</text>

  <!-- instructions -->
  <g transform="translate(480,100)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#222">Step by step</text>
    <text x="0" y="28" font-weight="bold" fill="#1d8a4a">① Chair spot</text>
    <text x="0" y="46" fill="#333">Measure the window wall's width, halve it.</text>
    <text x="0" y="63" fill="#333">Tape there, about 1 ft out from the wall.</text>
    <text x="0" y="93" font-weight="bold" fill="#1d8a4a">Set up the drone</text>
    <text x="0" y="111" fill="#333">Chair on ①. Books on the seat, drone on top:</text>
    <text x="0" y="128" fill="#333">camera lens about 2 ft 7½ in off the floor.</text>
    <text x="0" y="145" fill="#333">Camera lens pointing straight at the door.</text>
    <text x="0" y="175" font-weight="bold" fill="#1d8a4a">② CENTER</text>
    <text x="0" y="193" fill="#333">From the LENS, measure 8 ft 2½ in straight</text>
    <text x="0" y="210" fill="#333">toward the door. Tape an X.</text>
    <text x="0" y="240" font-weight="bold" fill="#1d8a4a">③ LEFT and ④ RIGHT</text>
    <text x="0" y="258" fill="#333">From ②, measure 2 ft 2½ in sideways each way</text>
    <text x="0" y="275" fill="#333">(parallel to the door). Tape an X on each.</text>
    <text x="0" y="292" fill="#333">LEFT = your left when standing behind the drone.</text>
    <text x="0" y="322" font-weight="bold" fill="#1d8a4a">Run it</text>
    <text x="0" y="340" fill="#333">Battery in, wait 30 s, join WiFi</text>
    <text x="0" y="357" fill="#333">"WiFi streaming example", then in Terminal:</text>
    <rect x="0" y="366" width="410" height="24" rx="4" fill="#f2f2f2" stroke="#ccc"/>
    <text x="8" y="383" font-family="Menlo, monospace" font-size="11.5" fill="#222">zsh ~/Downloads/drone/pytorch_ssd/tools/real_frames/camera_check.sh</text>
    <text x="0" y="412" fill="#333">Press Enter → walk to ③ LEFT in the countdown →</text>
    <text x="0" y="429" fill="#333">stand still, face the drone, 10 s. Then same on ④.</text>
    <text x="0" y="446" fill="#333">② CENTER is just a reference; nobody stands there.</text>
    <text x="0" y="476" font-weight="bold" fill="#c0392b">Done when it prints MIRROR CHECK … PASS.</text>
    <text x="0" y="494" fill="#333">Rejoin normal WiFi and send Claude the folder name.</text>
    <text x="0" y="524" fill="#888" font-size="11">Lighthouse tape is a DIFFERENT sheet (dorm_lighthouse_tape.svg),</text>
    <text x="0" y="540" fill="#888" font-size="11">tomorrow. Don't mix them up. Room size is estimated from photos.</text>
  </g>
</svg>
