<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Dorm layout: Lighthouse base stations, origin tape, camera-check marks</title>
  <rect width="860" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4a"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#c9a877" stroke-width="2"/></pattern>
  </defs>

  <text x="20" y="28" font-size="17" font-weight="bold" fill="#222">Dorm setup, top-down (sketch from photos, 2026-09-22)</text>
  <text x="20" y="46" fill="#666">Scale ≈ 1 m = 100 px. Room ≈ 3.5 × 4.6 m is an ESTIMATE, so measure it. Furniture positions approximate.</text>

  <!-- room walls: x 60..410, y 70..530 -->
  <rect x="60" y="70" width="350" height="460" fill="#fafafa" stroke="#333" stroke-width="4"/>
  <!-- windows on top wall -->
  <line x1="80" y1="70" x2="150" y2="70" stroke="#6fb3e0" stroke-width="6"/>
  <line x1="250" y1="70" x2="395" y2="70" stroke="#6fb3e0" stroke-width="6"/>
  <text x="235" y="63" text-anchor="middle" fill="#2a7ab0">WINDOW WALL (close blinds + curtain)</text>
  <rect x="252" y="74" width="120" height="12" fill="#ddd" stroke="#999"/>
  <text x="312" y="84" text-anchor="middle" font-size="9" fill="#555">radiator</text>

  <!-- door on bottom wall -->
  <line x1="150" y1="530" x2="235" y2="530" stroke="#fafafa" stroke-width="6"/>
  <path d="M150,530 A85,85 0 0 1 235,445" fill="none" stroke="#999" stroke-dasharray="4 3"/>
  <line x1="150" y1="530" x2="150" y2="445" stroke="#777" stroke-width="3"/>
  <text x="192" y="552" text-anchor="middle" fill="#333">DOOR</text>
  <text x="192" y="566" text-anchor="middle" font-size="10" fill="#b03030">mirror on back? cover it</text>

  <!-- Sai's side (left wall) -->
  <rect x="63" y="73" width="60" height="55" fill="#e8e8e8" stroke="#888"/>
  <text x="93" y="97" text-anchor="middle" font-size="10" fill="#444">fridge +</text>
  <text x="93" y="109" text-anchor="middle" font-size="10" fill="#444">shelves</text>
  <rect x="63" y="140" width="95" height="210" fill="url(#hatch)" stroke="#a07a45" stroke-width="2"/>
  <rect x="80" y="225" width="70" height="44" fill="#fff" opacity="0.85"/>
  <text x="115" y="243" text-anchor="middle" fill="#6b4a1e" font-weight="bold">Sai's loft</text>
  <text x="115" y="258" text-anchor="middle" font-size="10" fill="#6b4a1e">desk under</text>
  <rect x="72" y="478" width="36" height="36" rx="4" fill="#e3c79b" stroke="#a07a45"/>
  <text x="90" y="500" text-anchor="middle" font-size="9" fill="#6b4a1e">chair</text>
  <rect x="60" y="486" width="7" height="12" fill="#444"/>
  <text x="46" y="496" text-anchor="end" font-size="9" fill="#444">outlet</text>

  <!-- roommate's side (right wall) -->
  <rect x="312" y="215" width="95" height="210" fill="url(#hatch)" stroke="#a07a45" stroke-width="2"/>
  <rect x="320" y="298" width="80" height="44" fill="#fff" opacity="0.85"/>
  <text x="360" y="316" text-anchor="middle" fill="#6b4a1e" font-weight="bold">roommate's</text>
  <text x="360" y="331" text-anchor="middle" font-size="10" fill="#6b4a1e">loft + desk</text>
  <rect x="330" y="470" width="34" height="34" rx="4" fill="#e3c79b" stroke="#a07a45"/>
  <circle cx="388" cy="500" r="16" fill="#f0f0f0" stroke="#999"/>
  <text x="388" y="503" text-anchor="middle" font-size="8" fill="#666">basket</text>

  <!-- rug / working aisle -->
  <rect x="178" y="150" width="115" height="280" fill="#dfe6f2" stroke="#9aa9c4" stroke-dasharray="3 3"/>
  <text x="236" y="425" text-anchor="middle" font-size="10" fill="#6a7a99">rug = working aisle</text>

  <!-- base stations + aim -->
  <line x1="95" y1="455" x2="232" y2="300" stroke="#e07b00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="388" y1="112" x2="238" y2="296" stroke="#e07b00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="95" cy="455" r="14" fill="#e07b00" stroke="#8a4a00" stroke-width="2"/>
  <text x="95" y="460" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
  <text x="115" y="448" fill="#8a4a00" font-weight="bold">Station 1 (ch 1)</text>
  <circle cx="388" cy="112" r="14" fill="#e07b00" stroke="#8a4a00" stroke-width="2"/>
  <text x="388" y="117" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
  <text x="300" y="138" fill="#8a4a00" font-weight="bold">Station 2 (ch 2)</text>

  <!-- Lighthouse origin tape -->
  <g stroke="#1f5fbf" stroke-width="3"><line x1="227" y1="292" x2="243" y2="308"/><line x1="243" y1="292" x2="227" y2="308"/></g>
  <text x="248" y="316" fill="#1f5fbf" font-weight="bold">ORIGIN X</text>
  <line x1="235" y1="290" x2="235" y2="204" stroke="#1f5fbf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="227" y1="200" x2="243" y2="200" stroke="#1f5fbf" stroke-width="3"/>
  <text x="248" y="198" fill="#1f5fbf" font-weight="bold">+x mark</text>
  <text x="248" y="211" fill="#1f5fbf" font-size="10">exactly 1.00 m</text>
  <line x1="231" y1="300" x2="190" y2="300" stroke="#1f5fbf" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="186" y="294" text-anchor="end" fill="#1f5fbf" font-size="10">y</text>

  <!-- camera check: drone at window end facing the door -->
  <line x1="235" y1="112" x2="167" y2="362" stroke="#1d8a4a" stroke-width="1" opacity="0.6"/>
  <line x1="235" y1="112" x2="303" y2="362" stroke="#1d8a4a" stroke-width="1" opacity="0.6"/>
  <line x1="235" y1="112" x2="235" y2="362" stroke="#1d8a4a" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="221" y="98" width="28" height="22" rx="4" fill="#1d8a4a"/>
  <text x="235" y="113" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">CF</text>
  <line x1="235" y1="122" x2="235" y2="146" stroke="#1d8a4a" stroke-width="2.5" marker-end="url(#arrg)"/>
  <text x="130" y="94" fill="#1d8a4a" font-size="10">drone on chair,</text><text x="130" y="106" fill="#1d8a4a" font-size="10">lens ~0.8 m up,</text>
  <text x="130" y="118" fill="#1d8a4a" font-size="10">faces the door</text>
  <!-- marks at 2.5 m, +-15 deg = 0.67 m -->
  <g fill="#fff" stroke="#1d8a4a" stroke-width="2.5">
    <rect x="159" y="354" width="16" height="16"/><rect x="295" y="354" width="16" height="16"/><rect x="227" y="354" width="16" height="16"/>
  </g>
  <text x="303" y="386" text-anchor="middle" fill="#1d8a4a" font-weight="bold">LEFT</text>
  <text x="303" y="399" text-anchor="middle" fill="#1d8a4a" font-size="10">(−15°)</text>
  <text x="167" y="386" text-anchor="middle" fill="#1d8a4a" font-weight="bold">RIGHT</text>
  <text x="167" y="399" text-anchor="middle" fill="#1d8a4a" font-size="10">(+15°)</text>
  <text x="235" y="386" text-anchor="middle" fill="#1d8a4a" font-size="10">centre</text>
  <text x="104" y="366" text-anchor="middle" fill="#1d8a4a" font-size="10">2.5 m from lens</text>

  <!-- legend / instructions -->
  <g transform="translate(445,80)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#8a4a00">Lighthouse base stations (V2)</text>
    <text x="0" y="20" fill="#333">• Diagonal corners, one at each END of the room</text>
    <text x="0" y="37" fill="#333">• Above the loft mattresses (~2 m+ on the stands)</text>
    <text x="0" y="54" fill="#333">• Tilt 30–45° down, aim at the ORIGIN X, lock heads</text>
    <text x="0" y="71" fill="#333">• Channels: station 1 → ch 1, station 2 → ch 2</text>
    <text x="0" y="88" fill="#333">• Check: stand on the X, you can see both fronts</text>

    <text x="0" y="122" font-size="14" font-weight="bold" fill="#1f5fbf">Blue tape (permanent, Lighthouse frame)</text>
    <text x="0" y="142" fill="#333">• ORIGIN X mid-rug</text>
    <text x="0" y="159" fill="#333">• +x mark exactly 1.00 m toward the window</text>
    <text x="0" y="176" fill="#333">• y points to the left of +x; z is up</text>
    <text x="0" y="193" fill="#333">• Never move these once geometry is set</text>

    <text x="0" y="227" font-size="14" font-weight="bold" fill="#1d8a4a">Green tape (camera / mirror check)</text>
    <text x="0" y="247" fill="#333">• Drone at the window end, centre of the aisle,</text>
    <text x="0" y="264" fill="#333">   camera facing the DOOR (window behind it, not</text>
    <text x="0" y="281" fill="#333">   behind you, so you're not a silhouette)</text>
    <text x="0" y="298" fill="#333">• Three marks 2.5 m out: centre, and 0.67 m</text>
    <text x="0" y="315" fill="#333">   either side (±15°)</text>
    <text x="0" y="332" fill="#333">• LEFT = the drone's left. Stand BEHIND the drone,</text>
    <text x="0" y="349" fill="#333">   look where it looks: your left hand = LEFT</text>
    <text x="0" y="366" fill="#333">• Clip order: LEFT first, then RIGHT</text>
    <text x="0" y="383" fill="#333">• Run: zsh tools/real_frames/camera_check.sh</text>

    <text x="0" y="417" font-size="14" font-weight="bold" fill="#b03030">Room rules</text>
    <text x="0" y="437" fill="#333">• Cover mirrors · close blinds · door shut</text>
    <text x="0" y="454" fill="#333">• Nothing flies here. Props can stay on for capture</text>
    <text x="0" y="471" fill="#333">• Cables along the walls, not across the aisle</text>
  </g>
</svg>
